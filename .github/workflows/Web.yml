name: Web

# One flow for everything: fetch episodes from Spotify, commit data/episodes.json when it
# changed, then build and deploy in the same run. (A push made with GITHUB_TOKEN never starts
# another workflow run, so there is no loop and no PAT is needed.)
on:
  schedule:
    # Daily: season episodes go out Mondays ~04:00 UTC, Changelogs mid-week.
    # A day without new episodes only rebuilds the same page (no commit).
    - cron: '0 6 * * *'
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # On a code push a Spotify outage shouldn't block the deploy (the committed JSON is used);
      # scheduled and manual runs exist to refresh data, so there it fails the run.
      - name: Fetch episodes from Spotify
        id: fetch
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: yarn fetch-episodes

      - name: Commit updated episodes
        if: github.event_name != 'pull_request' && steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- data/episodes.json; then
            echo "No episode changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "Update episodes from Spotify"
          git push

      - name: Type check
        run: yarn typecheck

      - name: Build static site
        run: yarn build

      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          skip_app_build: true
          action: 'upload'
          app_location: 'out'
          output_location: ''
